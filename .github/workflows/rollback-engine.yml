name: rollback-thesis-engine

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "只回退论文审核引擎到指定的 sha-<40位提交> 镜像"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 核验目标镜像
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "只允许从 main 触发生产回滚" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "镜像 tag 必须为 sha-<40位小写十六进制提交>" >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
          trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT
          docker manifest inspect "$DOCKERHUB_USERNAME/thesis-backend:$IMAGE_TAG" >/dev/null

      - name: SSH 仅回退论文审核引擎
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" deploy/rollback-engine.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && chmod +x rollback-engine.sh && ./rollback-engine.sh '$IMAGE_TAG'"
