services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thesis
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置POSTGRES_PASSWORD}
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d thesis"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 18098
      THESIS_STORAGE_ROOT: /data/thesis-inspection
      THESIS_MAX_UPLOAD_BYTES: 52428800
      THESIS_ANNOTATION_RETENTION: PT1H
    volumes:
      - thesis-data:/data/thesis-inspection
    expose:
      - "18098"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18098/api/inspections/health | grep -q 'UP'"]
      interval: 30s
      timeout: 5s
      retries: 3

  platform:
    build:
      context: ./platform-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 18099
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thesis
      SPRING_DATASOURCE_USERNAME: thesis
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?请配置POSTGRES_PASSWORD}
      INITIAL_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:?请配置首次管理员账号}
      INITIAL_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?请配置首次管理员密码}
      COS_BUCKET: ${COS_BUCKET:?请配置私有COS桶名称}
      COS_REGION: ${COS_REGION:?请配置COS地域}
      COS_ENDPOINT: ${COS_ENDPOINT:?请配置COS访问endpoint}
      COS_PUBLIC_ENDPOINT: ${COS_PUBLIC_ENDPOINT:?请配置COS公网endpoint}
      COS_SECRET_ID: ${COS_SECRET_ID:?请配置COS访问ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?请配置COS访问密钥}
      TRANSFER_MODE: ${TRANSFER_MODE:?请配置传输模式}
      PRESIGN_EXPIRE_SECONDS: ${PRESIGN_EXPIRE_SECONDS:?请配置预签名有效期}
      PLATFORM_ENGINE_BASE_URL: http://backend:18098
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?请配置会话Cookie安全开关}
    expose:
      - "18099"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18099/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    stop_grace_period: 45s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      platform:
        condition: service_healthy
    ports:
      - "${PLATFORM_HTTP_PORT:-8080}:8080"

volumes:
  thesis-data:
  platform-db:
