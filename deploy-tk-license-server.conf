server {
  listen 80;
  listen [::]:80;
  server_name 124.223.86.157;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/tk-license-acme;
    try_files $uri =404;
  }

  location / {
    return 301 https://124.223.86.157$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name 124.223.86.157;
  client_max_body_size 16m;

  ssl_certificate /etc/letsencrypt/live/124.223.86.157/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/124.223.86.157/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location = /tk-license {
    return 301 /tk-license/;
  }

  location /tk-license/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
